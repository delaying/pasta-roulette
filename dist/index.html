<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9f2f22">
  <meta name="description" content="하루에 한 번 만나는 오늘의 파스타 룰렛">
  <title>오늘의 파스타 룰렛</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f8d98b' stroke='%239f2f22' stroke-width='6'/%3E%3Cpath d='M17 27c11-8 27-6 31 1M16 34c11-7 27-6 33 1M19 41c10-6 22-5 28-1' fill='none' stroke='%239f2f22' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='43' cy='18' r='4' fill='%233d673c'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #342017;
      --cream: #fff9eb;
      --paper: #f8e9c8;
      --tomato: #9f2f22;
      --tomato-dark: #752219;
      --basil: #3f6541;
      --gold: #e6aa48;
      --shadow: rgba(76, 40, 18, .22);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: #ead3a6; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.55) 0 2px, transparent 3px),
        radial-gradient(circle at 81% 72%, rgba(117,34,25,.08) 0 2px, transparent 3px),
        linear-gradient(145deg, #fff4d8 0%, #f1d59e 100%);
      background-size: 34px 34px, 42px 42px, auto;
      overflow-x: hidden;
    }

    .shell {
      width: min(100%, 560px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--basil);
      font-family: Georgia, "Times New Roman", serif;
      font-size: .88rem;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--tomato-dark);
      font-family: Georgia, "Times New Roman", "Noto Serif KR", serif;
      font-size: clamp(2rem, 8vw, 3.1rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .date {
      margin: 10px 0 0;
      color: rgba(52,32,23,.68);
      font-size: .92rem;
    }

    .roulette-stage {
      position: relative;
      width: min(86vw, 400px);
      aspect-ratio: 1;
      margin: 24px auto 18px;
      filter: drop-shadow(0 16px 18px var(--shadow));
    }

    .pointer {
      position: absolute;
      z-index: 4;
      top: -7px;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 34px solid var(--tomato-dark);
      transform: translateX(-50%);
      filter: drop-shadow(0 3px 1px rgba(52,32,23,.24));
    }

    .wheel {
      position: absolute;
      inset: 9px;
      border: 9px solid var(--cream);
      border-radius: 50%;
      background: conic-gradient(
        from -22.5deg,
        #af3b2e 0deg 45deg,
        #f0b84d 45deg 90deg,
        #48704a 90deg 135deg,
        #d86d3c 135deg 180deg,
        #ecd27b 180deg 225deg,
        #8c3e2d 225deg 270deg,
        #5c8054 270deg 315deg,
        #e29a45 315deg 360deg
      );
      box-shadow: inset 0 0 0 3px rgba(84,37,19,.18), 0 0 0 3px var(--tomato-dark);
      transition: transform 4.6s cubic-bezier(.12,.72,.12,1);
      will-change: transform;
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 43%;
      border-radius: 50%;
      background: var(--cream);
      border: 4px solid var(--tomato-dark);
      box-shadow: 0 3px 8px rgba(52,32,23,.25);
    }

    .wheel-label {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: 31%;
      color: #fffdf4;
      font-size: clamp(.66rem, 2.8vw, .92rem);
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 1px 2px rgba(52,32,23,.46);
      transform-origin: 0 0;
    }

    .wheel-label:nth-child(1) { transform: rotate(0deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(2) { transform: rotate(45deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(3) { transform: rotate(90deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(4) { transform: rotate(135deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(5) { transform: rotate(180deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(6) { transform: rotate(225deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(7) { transform: rotate(270deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(8) { transform: rotate(315deg) translate(-50%, -148%) translateY(-115px); }

    .result-card {
      width: 100%;
      min-height: 142px;
      padding: 22px 22px 20px;
      border: 1px solid rgba(117,34,25,.16);
      border-radius: 26px;
      background: rgba(255,249,235,.82);
      box-shadow: 0 10px 32px rgba(82,43,18,.12);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .55s ease, transform .55s ease;
    }

    .result-card.visible { opacity: 1; transform: translateY(0); }

    .result-inner { display: flex; align-items: center; gap: 18px; text-align: left; }

    .pasta-art { width: 92px; height: 92px; flex: 0 0 auto; object-fit: contain; }

    .result-kicker {
      margin: 0 0 4px;
      color: var(--basil);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .result-name {
      margin: 0;
      color: var(--tomato-dark);
      font-family: Georgia, "Times New Roman", "Noto Serif KR", serif;
      font-size: clamp(1.55rem, 6vw, 2.15rem);
      line-height: 1.15;
      word-break: keep-all;
    }

    .result-note { margin: 7px 0 0; color: rgba(52,32,23,.69); font-size: .9rem; line-height: 1.45; }

    .status {
      min-height: 24px;
      margin: 0 0 10px;
      color: rgba(52,32,23,.7);
      font-size: .91rem;
      font-weight: 650;
    }

    .spin-again {
      margin-top: 14px;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      color: #fffaf0;
      background: var(--tomato);
      font: inherit;
      font-size: .93rem;
      font-weight: 750;
      box-shadow: 0 6px 0 var(--tomato-dark);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .spin-again:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tomato-dark); }
    .spin-again:focus-visible { outline: 3px solid #1b6483; outline-offset: 4px; }
    .spin-again[disabled] { cursor: wait; opacity: .62; }

    footer { margin-top: auto; padding-top: 22px; color: rgba(52,32,23,.56); font-size: .78rem; }

    @media (max-width: 420px) {
      .shell { padding-inline: 16px; }
      .roulette-stage { width: min(90vw, 365px); }
      .wheel-label:nth-child(n) { --radius: 29vw; }
      .result-inner { gap: 10px; }
      .pasta-art { width: 76px; height: 76px; }
    }

    @media (max-width: 360px) {
      .roulette-stage { margin-top: 18px; }
      .wheel-label { font-size: .61rem; }
      .wheel-label:nth-child(1) { transform: rotate(0deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(2) { transform: rotate(45deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(3) { transform: rotate(90deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(4) { transform: rotate(135deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(5) { transform: rotate(180deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(6) { transform: rotate(225deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(7) { transform: rotate(270deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(8) { transform: rotate(315deg) translate(-50%, -145%) translateY(-92px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel { transition-duration: .01ms; }
      .result-card { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">Pasta del giorno</p>
    <h1>오늘의 파스타</h1>
    <p class="date" id="today"></p>

    <section class="roulette-stage" aria-label="파스타 룰렛이 돌아가는 중입니다">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel" id="wheel" aria-hidden="true">
        <span class="wheel-label">알리오<br>올리오</span>
        <span class="wheel-label">까르보<br>나라</span>
        <span class="wheel-label">봉골레</span>
        <span class="wheel-label">라구</span>
        <span class="wheel-label">로제</span>
        <span class="wheel-label">바질<br>페스토</span>
        <span class="wheel-label">아라비<br>아따</span>
        <span class="wheel-label">트러플<br>크림</span>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">오늘의 메뉴를 고르는 중…</p>

    <section class="result-card" id="result" aria-live="polite" aria-atomic="true">
      <div class="result-inner">
        <img class="pasta-art" src="pasta-bowl.png" alt="토마토와 바질을 곁들인 파스타 일러스트">
        <div>
          <p class="result-kicker">오늘의 선택</p>
          <h2 class="result-name" id="resultName"></h2>
          <p class="result-note" id="resultNote"></p>
        </div>
      </div>
      <button class="spin-again" id="spinAgain" type="button">같은 결과로 다시 돌리기</button>
    </section>

    <footer>이 기기에서는 자정까지 같은 메뉴가 표시돼요.</footer>
  </main>

  <script>
    (() => {
      const menus = [
        { name: '알리오 올리오', note: '마늘과 올리브오일의 담백한 한 접시' },
        { name: '까르보나라', note: '고소하고 진한 풍미가 당기는 날' },
        { name: '봉골레', note: '바다 향을 담은 산뜻한 선택' },
        { name: '라구 파스타', note: '천천히 끓여낸 깊은 맛으로 든든하게' },
        { name: '로제 파스타', note: '부드러움과 새콤함 사이의 완벽한 균형' },
        { name: '바질 페스토', note: '향긋하고 초록빛 가득한 한 접시' },
        { name: '아라비아따', note: '기분 좋은 매콤함으로 오늘을 깨우기' },
        { name: '트러플 크림', note: '향긋하고 부드러운 특별한 선택' }
      ];

      const STORAGE_KEY = 'pasta-roulette-daily-v1';
      const wheel = document.getElementById('wheel');
      const stage = document.querySelector('.roulette-stage');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const resultName = document.getElementById('resultName');
      const resultNote = document.getElementById('resultNote');
      const spinAgain = document.getElementById('spinAgain');
      const today = document.getElementById('today');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let turn = 0;

      const koreaDateKey = () => new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());

      const displayDate = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'long'
      }).format(new Date());
      today.textContent = displayDate;

      function getDailyChoice() {
        const date = koreaDateKey();
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (saved && saved.date === date && Number.isInteger(saved.index) && menus[saved.index]) {
            return { index: saved.index, isNew: false };
          }
        } catch (_) {}

        const values = new Uint32Array(1);
        crypto.getRandomValues(values);
        const index = values[0] % menus.length;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ date, index })); } catch (_) {}
        return { index, isNew: true };
      }

      const daily = getDailyChoice();

      function spin(isReplay = false) {
        spinAgain.disabled = true;
        result.classList.remove('visible');
        stage.setAttribute('aria-label', '파스타 룰렛이 돌아가는 중입니다');
        status.textContent = isReplay ? '오늘의 결과를 다시 확인하는 중…' : '오늘의 메뉴를 고르는 중…';

        turn += 1;
        const fullTurns = 5 + turn;
        const target = fullTurns * 360 - daily.index * 45;

        requestAnimationFrame(() => {
          wheel.style.transform = `rotate(${target}deg)`;
        });

        const delay = reducedMotion ? 40 : 4750;
        window.setTimeout(() => {
          const menu = menus[daily.index];
          resultName.textContent = menu.name;
          resultNote.textContent = menu.note;
          result.classList.add('visible');
          status.textContent = daily.isNew && !isReplay
            ? '오늘의 파스타가 정해졌어요!'
            : '오늘은 이 메뉴로 정해져 있어요.';
          stage.setAttribute('aria-label', `룰렛 결과: ${menu.name}`);
          spinAgain.disabled = false;
        }, delay);
      }

      spinAgain.addEventListener('click', () => spin(true));
      window.setTimeout(() => spin(false), 350);
    })();
  </script>
</body>
</html>
