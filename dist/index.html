<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9f2f22">
  <meta name="description" content="하루에 한 번 만나는 오늘의 파스타 룰렛">
  <title>오늘의 파스타 룰렛</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f8d98b' stroke='%239f2f22' stroke-width='6'/%3E%3Cpath d='M17 27c11-8 27-6 31 1M16 34c11-7 27-6 33 1M19 41c10-6 22-5 28-1' fill='none' stroke='%239f2f22' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='43' cy='18' r='4' fill='%233d673c'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #342017;
      --cream: #fff9eb;
      --paper: #f8e9c8;
      --tomato: #9f2f22;
      --tomato-dark: #752219;
      --basil: #3f6541;
      --gold: #e6aa48;
      --shadow: rgba(76, 40, 18, .22);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: #ead3a6; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.55) 0 2px, transparent 3px),
        radial-gradient(circle at 81% 72%, rgba(117,34,25,.08) 0 2px, transparent 3px),
        linear-gradient(145deg, #fff4d8 0%, #f1d59e 100%);
      background-size: 34px 34px, 42px 42px, auto;
      overflow-x: hidden;
    }

    .shell {
      width: min(100%, 560px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--basil);
      font-family: Georgia, "Times New Roman", serif;
      font-size: .88rem;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--tomato-dark);
      font-family: Georgia, "Times New Roman", "Noto Serif KR", serif;
      font-size: clamp(2rem, 8vw, 3.1rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .date {
      margin: 10px 0 0;
      color: rgba(52,32,23,.68);
      font-size: .92rem;
      font-weight: 650;
    }

    .roulette-stage {
      position: relative;
      width: min(86vw, 400px);
      aspect-ratio: 1;
      margin: 24px auto 18px;
      filter: drop-shadow(0 16px 18px var(--shadow));
    }

    .pointer {
      position: absolute;
      z-index: 4;
      top: -31px;
      left: 50%;
      width: 64px;
      height: 70px;
      object-fit: contain;
      transform: translateX(-50%);
      filter: drop-shadow(0 4px 3px rgba(52,32,23,.32));
    }

    .wheel {
      position: absolute;
      inset: 9px;
      border: 9px solid var(--cream);
      border-radius: 50%;
      background: conic-gradient(
        from -22.5deg,
        #af3b2e 0deg 45deg,
        #f0b84d 45deg 90deg,
        #48704a 90deg 135deg,
        #d86d3c 135deg 180deg,
        #af3b2e 180deg 225deg,
        #f0b84d 225deg 270deg,
        #48704a 270deg 315deg,
        #d86d3c 315deg 360deg
      );
      box-shadow: inset 0 0 0 3px rgba(84,37,19,.18), 0 0 0 3px var(--tomato-dark);
      transition: transform 7s cubic-bezier(.08,.7,.1,1);
      will-change: transform;
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 43%;
      border-radius: 50%;
      background: var(--cream);
      border: 4px solid var(--tomato-dark);
      box-shadow: 0 3px 8px rgba(52,32,23,.25);
    }

    .wheel-label {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      width: 31%;
      color: #fffdf4;
      font-size: clamp(.8rem, 3.7vw, 1rem);
      font-weight: 800;
      line-height: 1.08;
      text-shadow: 0 1px 2px rgba(52,32,23,.46);
      transform-origin: 0 0;
    }

    .wheel-label:nth-child(1) { transform: rotate(0deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(2) { transform: rotate(45deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(3) { transform: rotate(90deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(4) { transform: rotate(135deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(5) { transform: rotate(180deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(6) { transform: rotate(225deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(7) { transform: rotate(270deg) translate(-50%, -148%) translateY(-115px); }
    .wheel-label:nth-child(8) { transform: rotate(315deg) translate(-50%, -148%) translateY(-115px); }

    .result-card {
      width: 100%;
      min-height: 142px;
      padding: 22px 22px 20px;
      border: 1px solid rgba(117,34,25,.16);
      border-radius: 26px;
      background: rgba(255,249,235,.82);
      box-shadow: 0 10px 32px rgba(82,43,18,.12);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .55s ease, transform .55s ease;
    }

    .result-card.visible { opacity: 1; transform: translateY(0); }

    .result-inner { display: flex; align-items: center; gap: 18px; text-align: left; }

    .pasta-art {
      width: 126px;
      height: 102px;
      flex: 0 0 auto;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 5px 14px rgba(52,32,23,.18);
    }

    .result-kicker {
      margin: 0 0 4px;
      color: var(--basil);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .result-name {
      margin: 0;
      color: var(--tomato-dark);
      font-family: Georgia, "Times New Roman", "Noto Serif KR", serif;
      font-size: clamp(1.55rem, 6vw, 2.15rem);
      line-height: 1.15;
      word-break: keep-all;
    }

    .result-note { margin: 7px 0 0; color: rgba(52,32,23,.69); font-size: .9rem; line-height: 1.45; }

    .notice {
      margin-top: 18px;
      padding: 15px 16px;
      border-radius: 16px;
      background: rgba(230,170,72,.16);
      color: rgba(52,32,23,.82);
      text-align: left;
    }

    .notice-title { margin: 0 0 8px; color: var(--tomato-dark); font-size: .94rem; font-weight: 800; }
    .notice-list { margin: 0; padding-left: 1.35rem; font-size: .88rem; line-height: 1.55; word-break: keep-all; }
    .notice-list li + li { margin-top: 5px; }

    .status {
      min-height: 24px;
      margin: 0 0 10px;
      color: rgba(52,32,23,.7);
      font-size: .91rem;
      font-weight: 650;
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .save-result,
    .instagram-link {
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      color: #fffaf0;
      font: inherit;
      font-size: .93rem;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .save-result {
      background: var(--tomato);
      box-shadow: 0 6px 0 var(--tomato-dark);
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(115deg, #833ab4, #c13584 48%, #e1306c 72%, #f77737);
      box-shadow: 0 6px 0 #702759;
      text-decoration: none;
    }

    .save-result:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tomato-dark); }
    .instagram-link:active { transform: translateY(4px); box-shadow: 0 2px 0 #702759; }
    .save-result:focus-visible,
    .instagram-link:focus-visible { outline: 3px solid #1b6483; outline-offset: 4px; }
    .save-result[disabled] { cursor: wait; opacity: .62; }

    footer { margin-top: auto; padding-top: 22px; color: rgba(52,32,23,.56); font-size: .78rem; }

    @media (max-width: 420px) {
      .shell { padding-inline: 16px; }
      .roulette-stage { width: min(90vw, 365px); }
      .wheel-label:nth-child(n) { --radius: 29vw; }
      .result-inner { gap: 10px; }
      .pasta-art { width: 104px; height: 88px; }
      .result-actions { grid-template-columns: 1fr; }
    }

    @media (max-width: 360px) {
      .roulette-stage { margin-top: 18px; }
      .wheel-label { font-size: .76rem; }
      .wheel-label:nth-child(1) { transform: rotate(0deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(2) { transform: rotate(45deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(3) { transform: rotate(90deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(4) { transform: rotate(135deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(5) { transform: rotate(180deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(6) { transform: rotate(225deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(7) { transform: rotate(270deg) translate(-50%, -145%) translateY(-92px); }
      .wheel-label:nth-child(8) { transform: rotate(315deg) translate(-50%, -145%) translateY(-92px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel { transition-duration: .01ms; }
      .result-card { transition-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">Pasta del giorno</p>
    <h1>오늘의 파스타</h1>
    <p class="date" id="today"></p>

    <section class="roulette-stage" aria-label="파스타 룰렛이 돌아가는 중입니다">
      <img class="pointer" src="tomato-pointer.png" alt="" aria-hidden="true">
      <div class="wheel" id="wheel" aria-hidden="true">
        <span class="wheel-label">뽀모도로</span>
        <span class="wheel-label">라자냐</span>
        <span class="wheel-label">꼬막<br>봉골레</span>
        <span class="wheel-label">라구</span>
        <span class="wheel-label">뽀모도로</span>
        <span class="wheel-label">라자냐</span>
        <span class="wheel-label">꼬막<br>봉골레</span>
        <span class="wheel-label">라구</span>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">오늘의 메뉴를 고르는 중…</p>

    <section class="result-card" id="result" aria-live="polite" aria-atomic="true">
      <div class="result-inner">
        <img class="pasta-art" id="resultImage" src="menu-pomodoro.png" alt="뽀모도로 컵 스파게티">
        <div>
          <p class="result-kicker">오늘의 선택</p>
          <h2 class="result-name" id="resultName"></h2>
          <p class="result-note" id="resultNote"></p>
        </div>
      </div>
      <aside class="notice" aria-labelledby="noticeTitle">
        <p class="notice-title" id="noticeTitle">주의사항</p>
        <ol class="notice-list">
          <li>매장 내 식사 주문 고객 한정, 테이블당 1개 제공됩니다.</li>
          <li>당첨된 메뉴를 스크린샷으로 저장해 인스타그램 팔로잉과 함께 직원에게 보여주세요.</li>
        </ol>
      </aside>
      <div class="result-actions">
        <a class="instagram-link" href="https://www.instagram.com/pomo_table/" target="_blank" rel="noopener noreferrer" aria-label="Instagram에서 pomo_table 계정 열기">@pomo_table 팔로우</a>
        <button class="save-result" id="saveResult" type="button">당첨사진 저장하기</button>
      </div>
    </section>

    <footer>이 기기에서는 자정까지 같은 메뉴가 표시돼요.</footer>
  </main>

  <script>
    (() => {
      const menus = [
        { name: '뽀모도로 컵 스파게티', note: '상큼한 토마토 풍미를 담은 메뉴', image: 'menu-pomodoro.png' },
        { name: '라자냐 Small', note: '겹겹이 쌓인 풍성한 맛의 라자냐', image: 'menu-lasagna.png' },
        { name: '꼬막 봉골레 컵 스파게티', note: '꼬막과 마늘 향이 어우러진 메뉴', image: 'menu-kkomaek.png' },
        { name: '라구 컵 스파게티', note: '깊고 진한 라구 소스를 담은 메뉴', image: 'menu-ragu.png' }
      ];

      const STORAGE_KEY = 'pasta-roulette-daily-v1';
      const wheel = document.getElementById('wheel');
      const stage = document.querySelector('.roulette-stage');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const resultName = document.getElementById('resultName');
      const resultNote = document.getElementById('resultNote');
      const resultImage = document.getElementById('resultImage');
      const saveResult = document.getElementById('saveResult');
      const today = document.getElementById('today');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let turn = 0;

      const koreaDateKey = () => new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());

      const displayDate = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'long'
      }).format(new Date());
      today.textContent = `${displayDate} · 오늘은 뽀모가는날~♪`;

      function getDailyChoice() {
        const date = koreaDateKey();
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (saved && saved.date === date && Number.isInteger(saved.index) && menus[saved.index]) {
            return { index: saved.index, isNew: false };
          }
        } catch (_) {}

        const values = new Uint32Array(1);
        crypto.getRandomValues(values);
        const index = values[0] % menus.length;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ date, index })); } catch (_) {}
        return { index, isNew: true };
      }

      const daily = getDailyChoice();

      function spin() {
        saveResult.disabled = true;
        result.classList.remove('visible');
        stage.setAttribute('aria-label', '파스타 룰렛이 돌아가는 중입니다');
        status.textContent = '오늘의 메뉴를 고르는 중…';

        turn += 1;
        const fullTurns = 8 + turn;
        const duplicateOffset = (Number(koreaDateKey().slice(-2)) + daily.index) % 2 === 0 ? 0 : 4;
        const slotIndex = daily.index + duplicateOffset;
        const target = fullTurns * 360 - slotIndex * 45;

        requestAnimationFrame(() => {
          wheel.style.transform = `rotate(${target}deg)`;
        });

        const delay = reducedMotion ? 40 : 7150;
        window.setTimeout(() => {
          const menu = menus[daily.index];
          resultName.textContent = menu.name;
          resultNote.textContent = menu.note;
          resultImage.src = menu.image;
          resultImage.alt = menu.name;
          result.classList.add('visible');
          status.textContent = daily.isNew
            ? '오늘의 파스타가 정해졌어요!'
            : '오늘은 이 메뉴로 정해져 있어요.';
          stage.setAttribute('aria-label', `룰렛 결과: ${menu.name}`);
          saveResult.disabled = false;
        }, delay);
      }

      function roundedRect(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
        const chars = [...text];
        let line = '';
        let currentY = y;
        chars.forEach((char) => {
          const test = line + char;
          if (line && ctx.measureText(test).width > maxWidth) {
            ctx.fillText(line, x, currentY);
            line = char;
            currentY += lineHeight;
          } else {
            line = test;
          }
        });
        if (line) ctx.fillText(line, x, currentY);
        return currentY + lineHeight;
      }

      function drawImageCover(ctx, image, x, y, width, height, radius) {
        const imageRatio = image.naturalWidth / image.naturalHeight;
        const boxRatio = width / height;
        let sourceWidth = image.naturalWidth;
        let sourceHeight = image.naturalHeight;
        let sourceX = 0;
        let sourceY = 0;
        if (imageRatio > boxRatio) {
          sourceWidth = image.naturalHeight * boxRatio;
          sourceX = (image.naturalWidth - sourceWidth) / 2;
        } else {
          sourceHeight = image.naturalWidth / boxRatio;
          sourceY = (image.naturalHeight - sourceHeight) / 2;
        }
        ctx.save();
        roundedRect(ctx, x, y, width, height, radius);
        ctx.clip();
        ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
        ctx.restore();
      }

      async function createResultImage() {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const menu = menus[daily.index];
        const canvas = document.createElement('canvas');
        canvas.width = 1080;
        canvas.height = 1350;
        const ctx = canvas.getContext('2d');

        const background = ctx.createLinearGradient(0, 0, 1080, 1350);
        background.addColorStop(0, '#fff4d8');
        background.addColorStop(1, '#efd29a');
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.globalAlpha = .12;
        ctx.fillStyle = '#9f2f22';
        ctx.beginPath();
        ctx.arc(970, 120, 230, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#3f6541';
        ctx.beginPath();
        ctx.arc(70, 1260, 260, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.textAlign = 'center';
        ctx.fillStyle = '#3f6541';
        ctx.font = '700 30px Georgia, serif';
        ctx.fillText('POMO TABLE · PASTA DEL GIORNO', 540, 108);
        ctx.fillStyle = '#752219';
        ctx.font = '800 70px Georgia, "Noto Serif KR", serif';
        ctx.fillText('오늘의 당첨 메뉴', 540, 205);
        ctx.fillStyle = 'rgba(52,32,23,.68)';
        ctx.font = '500 32px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        ctx.fillText(displayDate, 540, 264);

        roundedRect(ctx, 90, 330, 900, 380, 42);
        ctx.fillStyle = 'rgba(255,249,235,.94)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(117,34,25,.16)';
        ctx.lineWidth = 3;
        ctx.stroke();

        const pastaImage = resultImage;
        if (!pastaImage.complete) await pastaImage.decode();
        drawImageCover(ctx, pastaImage, 180, 365, 720, 240, 28);
        ctx.fillStyle = '#3f6541';
        ctx.font = '800 26px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        ctx.fillText('오늘의 선택', 540, 635);
        ctx.fillStyle = '#752219';
        ctx.font = '800 48px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        drawWrappedText(ctx, menu.name, 540, 690, 790, 62);

        roundedRect(ctx, 90, 760, 900, 400, 34);
        ctx.fillStyle = 'rgba(255,249,235,.78)';
        ctx.fill();
        ctx.textAlign = 'left';
        ctx.fillStyle = '#752219';
        ctx.font = '800 34px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        ctx.fillText('주의사항', 145, 830);
        ctx.fillStyle = '#342017';
        ctx.font = '600 29px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        let nextY = drawWrappedText(ctx, '1. 매장 내 식사 주문 고객 한정, 테이블당 1개 제공됩니다.', 145, 900, 790, 47);
        drawWrappedText(ctx, '2. 당첨된 메뉴를 스크린샷으로 저장해 인스타그램 팔로잉과 함께 직원에게 보여주세요.', 145, nextY + 28, 790, 47);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#752219';
        ctx.font = '800 32px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        ctx.fillText('@pomo_table', 540, 1238);
        ctx.fillStyle = 'rgba(52,32,23,.6)';
        ctx.font = '500 24px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        ctx.fillText('직원 확인용 당첨 화면', 540, 1286);

        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('이미지를 만들 수 없습니다.')), 'image/png');
        });
      }

      saveResult.addEventListener('click', async () => {
        saveResult.disabled = true;
        const originalText = saveResult.textContent;
        saveResult.textContent = '사진 만드는 중…';
        try {
          const blob = await createResultImage();
          const filename = `pomo-오늘의-파스타-${koreaDateKey()}.png`;
          const file = new File([blob], filename, { type: 'image/png' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: '오늘의 파스타 당첨 결과' });
            status.textContent = '당첨사진을 공유했어요.';
          } else {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
            status.textContent = '당첨사진을 저장했어요.';
          }
        } catch (error) {
          if (error && error.name !== 'AbortError') status.textContent = '사진 저장에 실패했어요. 화면을 직접 캡처해 주세요.';
        } finally {
          saveResult.textContent = originalText;
          saveResult.disabled = false;
        }
      });

      window.setTimeout(() => spin(), 350);
    })();
  </script>
</body>
</html>
